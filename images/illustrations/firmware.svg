<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d"><title id="t">Embedded firmware capability map</title><desc id="d">A microcontroller in the centre connected to sensors, motors and actuators, relays, displays, Wi-Fi and Bluetooth, and serial interfaces.</desc><style>@media (prefers-reduced-motion:no-preference){.p{stroke-dasharray:5 18;animation:f 2.2s linear infinite}@keyframes f{to{stroke-dashoffset:-46}}}</style><rect x="60" y="60" width="160" height="62" rx="10" fill="#0f1b30" stroke="#2c4468"/><text x="76" y="87" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#e8f0fb">Sensors</text><text x="76" y="107" font-family="monospace" font-size="11.5" fill="#7f93b0">I2C · SPI · ADC</text><path class="p" d="M220 91 H234 L248 200" fill="none" stroke="#3d9bff" stroke-width="2"/><path d="M220 91 H234 L248 200" fill="none" stroke="#3d9bff" stroke-width="1" opacity=".35"/><rect x="60" y="170" width="160" height="62" rx="10" fill="#0f1b30" stroke="#2c4468"/><text x="76" y="197" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#e8f0fb">Motors &amp; actuators</text><text x="76" y="217" font-family="monospace" font-size="11.5" fill="#7f93b0">PWM · drivers</text><path class="p" d="M220 201 H234 L248 200" fill="none" stroke="#3d9bff" stroke-width="2"/><path d="M220 201 H234 L248 200" fill="none" stroke="#3d9bff" stroke-width="1" opacity=".35"/><rect x="60" y="280" width="160" height="62" rx="10" fill="#0f1b30" stroke="#2c4468"/><text x="76" y="307" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#e8f0fb">Relays</text><text x="76" y="327" font-family="monospace" font-size="11.5" fill="#7f93b0">GPIO switching</text><path class="p" d="M220 311 H234 L248 200" fill="none" stroke="#3d9bff" stroke-width="2"/><path d="M220 311 H234 L248 200" fill="none" stroke="#3d9bff" stroke-width="1" opacity=".35"/><rect x="420" y="60" width="160" height="62" rx="10" fill="#0